# releases.banco: serve install.sh e gli asset del rilascio del banco (SHA256SUMS, la firma, il
# binario) in https, come farebbero monsterterminal.com e GitHub. Solo file statici, nessun elenco.
# Risponde anche come github.com (alias di rete del container e SAN del certificato): così il
# connettore scarica gli aggiornamenti dall'URL VERO delle release (ADR 0438 D3: il prefisso
# https://github.com/monsterterminal/connector/releases/download/ è esatto, senza eccezioni di banco)
# e il banco lo serve da /srv/www/monsterterminal/connector/releases/download/.
server {
	listen 443 ssl;
	server_name releases.banco github.com;
	ssl_certificate /etc/nginx/tls/releases.banco.crt;
	ssl_certificate_key /etc/nginx/tls/releases.banco.key;
	ssl_protocols TLSv1.2 TLSv1.3;
	root /srv/www;
	autoindex off;
	location / {
		try_files $uri =404;
	}
}
