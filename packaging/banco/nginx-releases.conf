# releases.banco: serve install.sh e gli asset del rilascio del banco (SHA256SUMS, la firma, il
# binario) in https, come farebbero monsterterminal.com e GitHub. Solo file statici, nessun elenco.
server {
	listen 443 ssl;
	server_name releases.banco;
	ssl_certificate /etc/nginx/tls/releases.banco.crt;
	ssl_certificate_key /etc/nginx/tls/releases.banco.key;
	ssl_protocols TLSv1.2 TLSv1.3;
	root /srv/www;
	autoindex off;
	location / {
		try_files $uri =404;
	}
}
