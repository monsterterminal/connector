name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Go, tmux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: tmux per i test del terminale
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux
      - name: formato
        run: |
          if [ -n "$(gofmt -l .)" ]; then gofmt -l .; gofmt -d .; echo "gofmt: file non formattati"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...

  install-sh:
    name: install.sh (shellcheck, checkbashisms, banco di prova)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck devscripts dash
      - run: shellcheck -s sh packaging/install.sh packaging/install_test.sh scripts/firma-rilascio.sh scripts/firma-rilascio_test.sh
      - run: checkbashisms packaging/install.sh packaging/install_test.sh scripts/firma-rilascio.sh scripts/firma-rilascio_test.sh
      - run: dash packaging/install_test.sh
      - run: bash packaging/install_test.sh
      - run: dash scripts/firma-rilascio_test.sh

  # Le ricette del catalogo (recipes/, ADR 0410 A4, lotto L4): ogni recipes/<id>/<ver>.json è valida
  # contro lo schema 0.11.0, nei byte canonici che si firmano, con versioni fissate e source coerente;
  # dove il BOSS ha già firmato (<ver>.json.sig) la firma si verifica con la chiave pubblica
  # mt-recipes-2026. Gli script di validazione e firma hanno il loro banco (chiave usa e getta).
  ricette:
    name: "ricette del catalogo (schema, forma canonica, firme)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck devscripts dash jq
      - run: shellcheck -s sh scripts/valida-ricetta.sh scripts/valida-ricetta_test.sh scripts/firma-ricetta.sh scripts/firma-ricetta_test.sh
      - run: checkbashisms scripts/valida-ricetta.sh scripts/valida-ricetta_test.sh scripts/firma-ricetta.sh scripts/firma-ricetta_test.sh
      - run: dash scripts/valida-ricetta_test.sh
      - run: dash scripts/firma-ricetta_test.sh
      - name: ogni ricetta è valida
        run: sh scripts/valida-ricetta.sh recipes/*/*.json
      - name: ogni firma presente è di mt-recipes-2026
        run: |
          n=0
          for s in recipes/*/*.json.sig; do
            [ -e "$s" ] || continue
            f=${s%.sig}
            sh scripts/firma-ricetta.sh "$(basename "$(dirname "$f")")" "$(basename "$f" .json)" --verifica
            n=$((n + 1))
          done
          echo "firme verificate: $n"

  # Il banco con systemd (packaging/banco): il comando di una riga del cliente in un container
  # Ubuntu con systemd, rilascio locale firmato, backend finto; e l'aggiornamento automatico
  # (ADR 0438): update, ritorno alla versione precedente, i negativi. Pull delle immagini e build
  # Go dentro Docker: ~4-6 minuti a cache fredda sul runner GitHub.
  banco:
    name: "banco di prova (systemd: install, update, rollback, negativi)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash packaging/banco/banco.sh up
      - run: bash packaging/banco/banco.sh negative
      - run: bash packaging/banco/banco.sh install
      - run: bash packaging/banco/banco.sh spazi
      - run: bash packaging/banco/banco.sh update
      - run: bash packaging/banco/banco.sh rollback
      - run: bash packaging/banco/banco.sh update-negative
      - run: bash packaging/banco/banco.sh uninstall
      - name: log del banco (sempre)
        if: always()
        run: |
          for f in ~/mt-banco/status/*.log; do [ -f "$f" ] && { echo "== $f"; tail -n 40 "$f"; }; done || true
          docker logs mt-banco-fakeserver 2>&1 | tail -n 80 || true
          docker exec mt-banco-host journalctl --no-pager -n 120 -u monsterterminal-connector -u monsterterminal-connector-updater -u monsterterminal-connector-rollback 2>/dev/null || true
      - if: always()
        run: bash packaging/banco/banco.sh down

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /dev/null ./cmd/monsterterminal-connector
