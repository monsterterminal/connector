name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Go, tmux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: tmux per i test del terminale
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux
      - name: formato
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo 'gofmt: file non formattati'; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...

  install-sh:
    name: install.sh (shellcheck, checkbashisms, banco di prova)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck devscripts dash
      - run: shellcheck -s sh packaging/install.sh packaging/install_test.sh scripts/firma-rilascio.sh
      - run: checkbashisms packaging/install.sh packaging/install_test.sh scripts/firma-rilascio.sh
      - run: dash packaging/install_test.sh
      - run: bash packaging/install_test.sh

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /dev/null ./cmd/monsterterminal-connector
